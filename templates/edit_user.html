<!DOCTYPE html>
<html>
<head>
    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>Edit User</h2>

    <form method="POST">

        <div class="mb-3">
            <label>Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                value="{{ user.username }}"
                required>
        </div>

        <div class="mb-3">
            <label>Role</label>
            <input
                type="text"
                name="role"
                class="form-control"
                value="{{ user.role }}"
                required>
        </div>

        <button class="btn btn-primary">
            Update User
        </button>

        <a href="/users" class="btn btn-secondary">
            Back
        </a>

    </form>

</div>

</body>
</html>
